# HTTP - for internal Docker traffic (or redirect to HTTPS if public)
server {
    listen 80;
    server_name localhost;

    # Optional: redirect all external traffic to HTTPS if SSL is set up
    # return 301 https://$host$request_uri;

    # Forward internal request from node-app to ford-bot
    location /webhook {
        proxy_pass http://ford-bot:5000;  # Flask app
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: limit flooding to ford-bot
        limit_req zone=webhook_limit burst=10 nodelay;
    }

    location /home {
        proxy_pass http://ford-bot:5000;
    }

    # (Optional) add a route to verify nginx is working
    location /ping {
        return 200 "pong\n";
        add_header Content-Type text/plain;
    }
}

# Rate limiting config (for /webhook)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=5r/s;
